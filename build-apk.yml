name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID (letters and numbers only)"
        required: true
      app_name:
        description: "App name"
        required: true
      app_version:
        description: "App version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create app
        env:
          BUILD_ID: ${{ inputs.build_id }}
          APP_NAME: ${{ inputs.app_name }}
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          SAFE_ID=$(echo "$BUILD_ID" | tr -cd 'a-zA-Z0-9' | tr 'A-Z' 'a-z')
          cordova create app "com.html2apk.a${SAFE_ID}" "$APP_NAME"
          rm -rf app/www/*
          cp -r "builds/${BUILD_ID}/." app/www/
          cd app
          sed -i "s/version=\"1.0.0\"/version=\"${APP_VERSION}\"/" config.xml
          if [ -f www/icon.png ]; then
            sed -i 's#</widget>#  <icon src="www/icon.png" />\n</widget>#' config.xml
          fi
          cordova platform add android@13

      - name: Build APK
        working-directory: app
        run: cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: app/platforms/android/app/build/outputs/apk/debug/*.apk
